spring.application.name=ProContactos
# Puerto por defecto (opcional)
server.port=8080

# Prefijo y sufijo para las vistas (para JSP)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.html
# Nivel global
logging.level.root=INFO

# Nivel especifico para controladores
logging.level.org.springframework.web=DEBUG
logging.level.com.skillnest.web=DEBUG

# Log a archivo
logging.file.name=app.log

# Configuracion del datasource
spring.datasource.url=jdbc:mysql://localhost:3306/mibasededatos
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect